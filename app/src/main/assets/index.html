<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pokémon Access</title>
<style>
  body { font-family: sans-serif; font-size: 22px; margin: 2em; background: #111; color: #eee; }
  h1 { font-size: 1.6em; }
  button { font-size: 1.2em; padding: 0.8em 1.4em; margin: 0.6em 0.3em; }
  button:disabled { opacity: 0.5; }
  #status { margin-top: 1.2em; color: #9cf; min-height: 3em; }
  #pad { margin-top: 1em; display: none; flex-wrap: wrap; }
  #pad button { flex: 1 1 30%; }
</style>
</head>
<body>
  <h1>Pokémon Access</h1>
  <p id="intro">Load a Game Boy, Game Boy Color or Game Boy Advance game. The reader speaks the game's own content.</p>

  <button id="pickRom">Select Game</button>
  <button id="startGame" disabled>Start Game</button>
  <button id="stopGame" disabled>Stop</button>

  <div id="status" role="status" aria-live="polite">No game selected.</div>

  <div id="pad" role="group" aria-label="Game pad"></div>

<script>
  var statusEl = document.getElementById('status');
  var pickBtn  = document.getElementById('pickRom');
  var startBtn = document.getElementById('startGame');
  var stopBtn  = document.getElementById('stopGame');
  var padEl    = document.getElementById('pad');
  var introEl  = document.getElementById('intro');

  var pickedUri = null;      // the file the player chose, as a content:// URI
  var running = false;
  var frameTimer = null;

  function say(msg) {
    statusEl.textContent = msg;
    // hermes_tts is MainActivity's TtsBridge. Guarded because a WebView can
    // load this page before the bridge is attached.
    if (window.hermes_tts && hermes_tts.speak) hermes_tts.speak(msg, 'interrupt');
  }

  // ⛔ ASK THE NATIVE SIDE, NEVER ASSUME. This page used to hardcode "emulator
  // core integration is not compiled into this test build", which was true once
  // and then sat on screen for weeks after the core landed — a stale claim made
  // to the player. The capability now comes from the library that provides it,
  // so it cannot go stale.
  var available = false;
  try {
    available = window.oga_gb && oga_gb.isAvailable();
  } catch (e) {
    available = false;
  }

  if (!available) {
    pickBtn.disabled = true;
    say('This build has no Game Boy core compiled in, so games cannot be loaded.');
  } else {
    say('Pokémon Access ready. Press Select Game to choose a game.');
  }

  // The extensions the native side handles, so the picker text can name them
  // instead of listing them here and drifting.
  try {
    if (available && oga_gb.romExtensions) introEl.textContent =
      'Load a ' + oga_gb.romExtensions().toUpperCase().split(',').join(', ') +
      ' game. The reader speaks the game\'s own content.';
  } catch (e) { /* the default sentence above is fine */ }

  pickBtn.addEventListener('click', function () {
    if (!available) return;
    say('Choose a game.');
    // Native SAF picker. The result comes back through ogaRomPicked below when
    // the player is done — pickRom() returns immediately.
    oga_gb.pickRom();
  });

  // Called by MainActivity when the player picks a file (or cancels, with a
  // null URI so this can speak the cancellation instead of going silent).
  window.ogaRomPicked = function (uri, name) {
    if (!uri) { say('No game selected.'); return; }
    pickedUri = uri;
    startBtn.disabled = false;
    say(name + ' selected. Press Start Game.');
  };

  startBtn.addEventListener('click', function () {
    if (!pickedUri) { say('Select a game first.'); return; }
    var started = false;
    try { started = oga_gb.startGame(pickedUri); } catch (e) { started = false; }
    if (!started) {
      say('That game could not be started. ' + (oga_gb.lastError ? oga_gb.lastError() : ''));
      return;
    }
    running = true;
    startBtn.disabled = true;
    pickBtn.disabled = true;
    stopBtn.disabled = false;
    padEl.style.display = 'flex';
    say('Game started. The reader will speak one startup line, then only game content.');
    // The page owns the frame clock: one emulated frame per animation frame,
    // which is the same cadence the iOS app drives with a CADisplayLink and the
    // same cadence the reader assumes. Driving it from JS rather than a native
    // thread keeps the speech callbacks on the JS thread that spoke them.
    function tick() {
      if (!running) return;
      try { oga_gb.runFrame(); } catch (e) { /* a failed frame must not kill the loop */ }
      frameTimer = requestAnimationFrame(tick);
    }
    tick();
  });

  stopBtn.addEventListener('click', function () {
    running = false;
    if (frameTimer) { cancelAnimationFrame(frameTimer); frameTimer = null; }
    try { oga_gb.stopGame(); } catch (e) {}
    padEl.style.display = 'none';
    startBtn.disabled = false;
    pickBtn.disabled = false;
    stopBtn.disabled = true;
    say('Game stopped.');
  });

  // ---- the pad ------------------------------------------------------------
  //
  // mGBA key bits, matching GBAKey's order in the core: A=1, B=2, Select=4,
  // Start=8, Right=16, Left=32, Up=64, Down=128, R=256, L=512. Held keys are
  // OR'd together, because setKeys takes the whole mask.
  var KEY = { A:1, B:2, SELECT:4, START:8, RIGHT:16, LEFT:32, UP:64, DOWN:128, R:256, L:512 };
  var held = {};

  function pushKeys() {
    var mask = 0;
    for (var k in held) if (held[k]) mask |= KEY[k];
    try { oga_gb.setKeys(mask); } catch (e) {}
  }

  function addKeyButton(label, key, hint) {
    var b = document.createElement('button');
    b.textContent = label;
    b.setAttribute('aria-label', hint || label);
    b.addEventListener('pointerdown', function (e) {
      e.preventDefault(); held[key] = true; pushKeys();
    });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (ev) {
      b.addEventListener(ev, function () { held[key] = false; pushKeys(); });
    });
    padEl.appendChild(b);
  }

  ['A', 'B', 'SELECT', 'START', 'UP', 'DOWN', 'LEFT', 'RIGHT', 'L', 'R'].forEach(function (k) {
    addKeyButton(k, k, k + ' button');
  });

  // ---- script hotkeys -----------------------------------------------------
  //
  // The Pokémon Access reader's own keys. P pathfind, M map name, E tiles,
  // K read item, J previous, L next. These go to the reader, not the game.
  var hotkeyRow = document.createElement('div');
  hotkeyRow.setAttribute('role', 'group');
  hotkeyRow.setAttribute('aria-label', 'Reading commands');
  hotkeyRow.style.display = 'none';
  document.body.appendChild(hotkeyRow);

  [['Find path','P'], ['Where am I','M'], ['Tiles','E'],
   ['Read item','K'], ['Previous item','J'], ['Next item','L']].forEach(function (pair) {
    var b = document.createElement('button');
    b.textContent = pair[0];
    b.setAttribute('aria-label', pair[0] + '. Key ' + pair[1]);
    b.addEventListener('click', function () {
      try { oga_gb.setHotkey(pair[1], true); } catch (e) {}
      // Edge-triggered: the script's own edge detector wants one press, so the
      // release follows on the next frame rather than never.
      setTimeout(function () {
        try { oga_gb.setHotkey(pair[1], false); } catch (e) {}
      }, 80);
    });
    hotkeyRow.appendChild(b);
  });

  startBtn.addEventListener('click', function () { hotkeyRow.style.display = 'block'; });
  stopBtn.addEventListener('click', function () { hotkeyRow.style.display = 'none'; });
</script>
</body>
</html>
