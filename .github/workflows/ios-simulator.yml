name: iOS simulator app + run

# Builds the iOS Simulator .app on a macOS runner, then BOOTS A SIMULATED iPHONE,
# installs the app, launches it, and verifies it stays running.
#
# ⛔ WHY macOS AND WHY THE RUN MATTERS. A simulator runtime is CoreSimulator +
# launchd_sim + an iOS runtime sysroot, which ship with Xcode. There is no iOS
# Simulator for Windows or Linux — on Linux we can link a simulator-architected
# binary (platform iossimulator in its load commands) but nothing can execute it.
# The build is therefore verifiable anywhere; the RUN is only verifiable here.
#
# ⛔ WHY xtool AND NOT `swift build`. The package is a LIBRARY, not an executable:
# the app wrapper (main + Info.plist + bundle layout) is generated by xtool. A bare
# `swift build --triple ...-simulator` compiles the library and then leaves nothing
# to package, and `--sdk` breaks the manifest compile because that must target the
# host. xtool runs on Linux, Windows and macOS, so using it here means CI and this
# machine build the app the SAME way instead of by two different paths.
#
# ⛔ NO ROMS. The app ships with accessibility scripts only. A game is needed to
# exercise the readers and is supplied by the player, never by CI.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Core/**'
      - 'Sources/**'
      - 'scripts/**'
      - 'Package.swift'
      - '.github/workflows/ios-simulator.yml'

jobs:
  simulator:
    # macos-15 ships Xcode 16 / Swift 6. Package.swift declares tools 6.0, so a
    # Swift 5.10 runner fails with "using Swift tools version 6.0.0 but the
    # installed version is 5.10.0" before compiling anything.
    runs-on: macos-15
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4

      - name: Report the toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          swift --version
          xcrun simctl list runtimes | grep -i ios | tail -5

      - name: Install xtool
        run: |
          brew install xtool-org/tap/xtool || {
            echo "brew tap failed; falling back to the release bundle"
            curl -L -o /tmp/xtool.app.zip \
              https://github.com/xtool-org/xtool/releases/latest/download/xtool.app.zip
            unzip -q -o /tmp/xtool.app.zip -d /Applications
            sudo ln -sf /Applications/xtool.app/Contents/MacOS/xtool-cli /usr/local/bin/xtool
          }
          xtool --version || xtool help | head -5

      - name: Fetch the emulator core and Lua (not vendored here)
        run: ./scripts/bootstrap-deps.sh "$RUNNER_TEMP/src"

      - name: Build the core for the simulator platform
        env:
          MELONDS_SRC: ${{ runner.temp }}/src/melonds-lua
          LUA_SRC: ${{ runner.temp }}/src/lua-5.4.7
        run: |
          # Xcode's own simulator SDK, at whatever version this runner has. The
          # script defaults to xtool's fetched SDK path, which does not exist here.
          SDKROOT="$(xcrun --sdk iphonesimulator --show-sdk-path)" bash scripts/build-sim.sh

      - name: Build the app with xtool
        run: |
          export POKECORE_LIB="$PWD/Vendor/sim/libpokecore-sim.a"
          # xtool dev build produces an .app for the DEVICE triple and a linked
          # binary for the simulator triple; package-sim-app.sh assembles the
          # simulator bundle from whichever is produced.
          xtool dev build 2>&1 | tail -30 || true
          bash scripts/package-sim-app.sh

      - name: Verify the packaged app
        run: bash scripts/verify-sim-app.sh

      - name: Boot a simulated iPhone and run the app
        run: bash scripts/sim-uitest.sh

      - name: Upload the simulator app
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: open-game-access-ios-simulator
          path: |
            xtool-sim/PokemonAccess-simulator.zip
            xtool-sim/PokemonAccess.app
          if-no-files-found: warn

      - name: Upload evidence (screenshot, launch log)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-evidence
          path: |
            /tmp/oga-sim.png
            /tmp/oga-launch.txt
            /tmp/oga-launch2.txt
          if-no-files-found: ignore
