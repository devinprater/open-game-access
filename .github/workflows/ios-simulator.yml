name: iOS simulator app + run

# Builds the iOS Simulator .app on a macOS runner, then BOOTS A SIMULATED iPHONE,
# installs the app, launches it, and verifies it stays running.
#
# ⛔ WHY THIS JOB IS macOS-ONLY AND WHY THE RUN MATTERS. A simulator runtime is
# CoreSimulator + launchd_sim + an iOS runtime sysroot, which ship with Xcode.
# There is no iOS Simulator for Windows or Linux — on Linux we can link a
# simulator-architected binary (`platform iossimulator` in its load commands) but
# nothing can execute it. So the build is verifiable anywhere; the RUN is not.
#
# This workflow is therefore the only automated place the app is proven to launch
# on a simulated iPhone. See docs/building.md.
#
# ⛔ NO ROMS. The app ships with accessibility scripts only. A game is needed to
# exercise the readers, and it is supplied by the player, never by CI.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Core/**'
      - 'Sources/**'
      - 'scripts/**'
      - '.github/workflows/ios-simulator.yml'

jobs:
  simulator:
    # macos-15 ships Xcode 16 / Swift 6. Package.swift declares tools 6.0, so a
    # Swift 5.10 runner (macos-14) fails with "using Swift tools version 6.0.0 but
    # the installed version is 5.10.0" before compiling anything.
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          swift --version
          xcrun simctl list runtimes | grep -i ios | tail -5

      - name: Fetch the emulator core and Lua (not vendored here)
        run: ./scripts/bootstrap-deps.sh "$RUNNER_TEMP/src"

      - name: Build the core for the simulator platform
        env:
          MELONDS_SRC: ${{ runner.temp }}/src/melonds-lua
          LUA_SRC: ${{ runner.temp }}/src/lua-5.4.7
        run: |
          # Xcode's own simulator SDK, at whatever version this runner has. The
          # script defaults to xtool's fetched SDK path, which does not exist here.
          SDKROOT="$(xcrun --sdk iphonesimulator --show-sdk-path)" bash scripts/build-sim.sh

      - name: Package the simulator app
        run: bash scripts/package-sim-app.sh

      - name: Verify the packaged app
        run: bash scripts/verify-sim-app.sh

      - name: Boot a simulated iPhone and run the app
        run: bash scripts/sim-uitest.sh

      - name: Upload the simulator app
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: open-game-access-ios-simulator
          path: |
            xtool-sim/PokemonAccess-simulator.zip
            xtool-sim/PokemonAccess.app
          if-no-files-found: warn

      - name: Upload evidence (screenshot, launch log)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-evidence
          path: |
            /tmp/oga-sim.png
            /tmp/oga-launch.log
          if-no-files-found: ignore
