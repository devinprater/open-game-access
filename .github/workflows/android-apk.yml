name: Android APK

# Builds the Android accessibility app (a melonDS-android fork) and attaches the
# APK to a release.
#
# ⛔ NO ROMS. The APK ships with the accessibility Lua scripts only; no game data.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125 cmake;3.22.1'

      # The JIT is what makes the emulator fast enough to leave headroom for the
      # accessibility adapters, and a missing ARCHITECTURE silently turns it OFF.
      # Assert the pins before spending 20 minutes on the build.
      # ⛔ THE CHEAPEST GATE, AND IT RUNS FIRST. A syntax error in any tracked
      # shell script breaks the whole workflow minutes later with a message that
      # points at the wrong place -- bootstrap-deps.sh spent a day with an
      # unterminated quote and CI found it on a release tag.
      - name: Shell scripts must parse
        run: bash scripts/check-shell-syntax.sh

      - name: Assert the core is configured for the JIT
        run: bash scripts/android-jit-check.sh "$GITHUB_WORKSPACE"

      - name: Fetch the Android frontend (a fork of melonDS-android)
        run: |
          cat <<'EOF'
          The Android app is a thin accessibility layer over rafaelvcaetano/melonDS-android,
          which is GPL-3.0 and NOT vendored here. We clone it and apply this repo's
          overlay (app/native-overlay) plus the Lua-enabled core.
          EOF
          git clone --depth 1 https://github.com/rafaelvcaetano/melonDS-android.git frontend
          git -C frontend submodule update --init --recursive --depth 1

      - name: Swap in the Lua-enabled core
        run: |
          ./scripts/bootstrap-deps.sh "$RUNNER_TEMP/src"
          MELONDS_LUA="$RUNNER_TEMP/src/melonds-lua"
          # The Lua fork replaces the core submodule.
          rm -rf frontend/melonDS-android-lib
          cp -r "$MELONDS_LUA" frontend/melonDS-android-lib

      # ⛔ NOT a blind `cp -r app/src/main/.`. That OVERWROTE upstream's
      # res/values/strings.xml (475 entries) and AndroidManifest.xml (every
      # upstream activity) with ours, which is why the Kotlin step failed on
      # ~50 unresolvable R.string.* in unmodified upstream files. The script
      # merges resources and appends to the manifest instead, and injects the
      # JIT/ARCHITECTURE arguments into the native config.
      - name: Apply the Open Game Access overlay
        env:
          # The GBA/Game Boy core is built from the audited mGBA source list plus
          # Lua 5.4. Without these the overlay skips that section silently -- which
          # is how the omission survived the first time.
          MGBA_SRC: ${{ runner.temp }}/src/mgba
          LUA_SRC: ${{ runner.temp }}/src/lua-5.4.7
        run: bash scripts/android-apply-overlay.sh "$GITHUB_WORKSPACE/frontend" "$GITHUB_WORKSPACE"

      # The shell is melonDS 2025; our core is melonDS-lua 2026, which refactored
      # the renderer (Renderer3D -> one Renderer) and Args.h. This edits the SHELL
      # to match our core -- the Lua-enabled emulator is the piece we want, and it
      # is already proven on iOS.
      - name: Retarget the shell to our core's API
        run: bash scripts/android-port-core-api.sh "$GITHUB_WORKSPACE/frontend"

      - name: Build debug APK
        working-directory: frontend
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          # The upstream clone does not preserve the executable bit on gradlew
          # (it is checked in via git but arrives mode 644 through some checkouts),
          # so invoking it directly fails with "Permission denied" / exit 126.
          chmod +x ./gradlew
          ./gradlew :app:assembleGitHubProdDebug --no-daemon

      - name: Verify the APK carries the accessibility scripts
        run: |
          APK=$(find frontend/app/build/outputs/apk -name '*.apk' | head -1)
          test -n "$APK" || { echo "no APK produced"; exit 1; }
          echo "APK: $APK ($(stat -c%s "$APK") bytes)"
          # The whole point: the Lua reader must be inside the APK. Take the file
          # list to a file first -- `unzip -l | grep -q` dies of SIGPIPE under
          # pipefail when the pattern DOES match, which reports a false failure.
          unzip -l "$APK" > "$RUNNER_TEMP/apk-list.txt" || true
          grep -qi lua "$RUNNER_TEMP/apk-list.txt" \
            || { echo "!! no Lua assets in the APK"; exit 1; }
          echo "ok: Lua assets present"

      - name: Confirm no game data is present
        run: |
          # Repo guard: the game-data scan is strict and covers everything, but the
          # build-output checks (artifacts, >10 MB files) must skip the build tree --
          # this step runs AFTER the APK is built, so scanning that tree finds the
          # APK we are about to upload and fails on it.
          ./scripts/check-no-roms.sh . --skip-build-output
          # Belt and braces: game data must be absent from the build tree too.
          ! find frontend/app/build -type f \
              \( -iname '*.nds' -o -iname '*.gba' -o -iname '*.gb' -o -iname '*.gbc' \
              -o -iname '*.sav' -o -iname '*.srm' -o -iname 'bios*.bin' \
              -o -iname 'firmware*.bin' \) | grep -q .

      - uses: actions/upload-artifact@v4
        with:
          name: open-game-access-android
          path: frontend/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: frontend/app/build/outputs/apk/**/*.apk
          fail_on_unmatched_files: false
