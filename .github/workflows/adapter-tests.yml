name: Adapter host tests

on:
  push:
    branches: [main]
    paths:
      - 'Core/**'
      - 'Sources/**'
      - 'scripts/**'
      - '.github/workflows/adapter-tests.yml'
  pull_request:
    paths:
      - 'Core/**'
      - 'Sources/**'
      - 'scripts/**'
      - '.github/workflows/adapter-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adapter-host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run standalone adapter tests
        run: bash scripts/adapter-tests.sh
      - name: Announcement queue (tests + sabotage verification)
        run: bash scripts/announce-test.sh
      # The system registry: which consoles this app knows, what each one's
      # hardware is, and whether a core for it is in this build. Guards the
      # rule that an unrecognised file must never resolve to a console.
      - name: System registry tests
        run: bash scripts/systems-test.sh
      # The backend ops tables are POSITIONAL initializers. Adding a field to
      # OgaCoreOps and forgetting one table rotates it -- read_audio lands in
      # reader_set and the app calls the wrong function, with a clean build.
      - name: Backend ops-table parity
        run: python3 scripts/oga-ops-check.py
      # The NES reader sets are bundled resources and were absent from the shipped
      # IPA for a whole release while every build reported success. This asserts
      # the files the core's table names exist AND that each wrapper derives its
      # own path (one hard-coded the developer's home directory).
      - name: Bundled NES reader sets
        run: bash scripts/nes-reader-assets-test.sh
      # The readers' positional cues (42 audio.play sites) were silently dropped for
      # the whole life of the project: oga_audio.lua had a set_sink() handoff that
      # nothing ever called, so the pan -- which IS the information -- never left Lua.
      # This drives the shipped file with a stand-in host sink and proves each cue
      # arrives with its pan intact, then mutates the Lua to prove it can fail.
      # The runner ships no Lua, and the check would otherwise print SKIP -- a green
      # step that verified nothing. Lua 5.4 is what the script hunts for and what the
      # app's mGBA embeds, so install it and let the check actually drive the file.
      - name: Install Lua (for the cue-sink check)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4
      - name: Reader positional cues reach the host
        run: bash scripts/cue-sink-test.sh
      # A RESET hook and a MOVEMENT hook are different kinds and must not share one poll.
      # pokemon.lua registers init_script at the CPU entry vector (0x100 GB / 0x8000000 GBA)
      # to survive a soft reset; the shim treated every registration as a footstep hook, so
      # init_script ran on every step, reloaded the reader and re-spoke "Ready" -- 729 times
      # in one measured Game Boy run. Drives the shipped shim in a real Lua 5.4 with a
      # stand-in mGBA host, then mutates it 3 ways and requires each mutant to fail.
      - name: Reset vs movement hooks stay separate
        run: bash scripts/registerexec-kind-test.sh
      - name: Verify compile-cache invalidation
        run: bash scripts/build-cache-test.sh
      - name: Verify mGBA version stub symbols
        run: bash scripts/mgba-version-stub-test.sh
      - name: Verify device/sim build flag parity
        run: bash scripts/build-flag-parity-test.sh
      # The Swift layer: a real swiftc type-check where Linux allows one, the C ABI
      # mirror (Command vs AdapterCommand — a drift silently rejects a new command),
      # and every poke_ symbol Swift calls. Skips are printed, never implied.
      - name: Swift checks (type-check + ABI mirror + symbols)
        run: bash scripts/swift-check.sh
      # Prove each Swift check CAN fail — a gate that only ever passes is not a gate.
      - name: Swift check self-test
        run: bash scripts/swift-check-test.sh
      # What every adapter actually SAYS, and at what priority. Catches an empty spoken
      # string, a High line that reads automatic, and an unfilled format specifier.
      - name: Adapter speech audit (gate + self-test)
        run: |
          python3 scripts/audit-adapter-speech.py --check Core
          bash scripts/audit-speech-test.sh
      # A script CI invokes must derive its own paths. This bug bit twice — once in a script
      # that already carried a comment about it, and again in the swift/ABI checks, which
      # failed their first CI run outright with FileNotFoundError on a dev path.
      - name: Hardcoded-path check (gate + self-test)
        run: |
          python3 scripts/path-check.py
          bash scripts/path-check-test.sh
